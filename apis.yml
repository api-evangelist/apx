aid: apx
name: APX
description: >-
  APX (APX Logistics Solutions) is a Southeast Asian less-than-truckload (LTL)
  digital logistics platform headquartered in Bangkok, with operations in
  Thailand, Malaysia, and Singapore. It positions itself as the region's first
  LTL digital logistics provider, offering domestic and cross-border shipping,
  international sea and air freight, customs brokerage, warehousing and
  distribution, project logistics, and heavy-lift/breakbulk services. Its
  proprietary technology platform provides online shipment booking, real-time
  tracking with ETA notifications, digital proof-of-delivery, AI-assisted route
  optimization, a driver app, and analytics dashboards including CO2/ESG
  reporting. APX is a portfolio company of 500 Global and was added to the API
  Evangelist network as a stub for enrichment. As of this enrichment pass APX
  publishes no first-party public developer API, SDKs, or developer portal;
  shipment tracking is currently integrable only via third-party aggregators.
